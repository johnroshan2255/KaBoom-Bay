<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KaBoom Bay screenshots</title>
<style>
  body { margin: 0; background: #0f2a3a; color: #f3f7f9; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { margin: 0 0 4px; color: #ff6b3d; font-size: 40px; }
  p.sub { margin: 0 0 32px; color: #a9c0cc; }
  figure { margin: 0 0 40px; }
  img { display: block; width: 100%; height: auto; border-radius: 12px; background: #163d52; }
  figcaption { margin-top: 10px; color: #a9c0cc; }
  figcaption b { color: #f3f7f9; }
</style>
</head>
<body>
<main>
  <h1>KaBoom Bay screenshots</h1>
  <p class="sub">Captured with headless Chrome (1280 × 800, software GL) from the current build. Open this file directly in a browser.</p>
  <figure><img src="01-menu.png" alt="Menu"><figcaption><b>01 Menu.</b> One click to play, tropical name pre-filled.</figcaption></figure>
  <figure><img src="02-lobby.png" alt="Lobby"><figcaption><b>02 Lobby.</b> Two players in a shared room, countdown running, ready toggle. Empty islands get bots.</figcaption></figure>
  <figure><img src="03-build.png" alt="Build phase"><figcaption><b>03 Build phase.</b> Four islands from the shared seed, your island front and centre, heroes on every pad, pieces placed by players and bots synced through the server.</figcaption></figure>
  <figure><img src="04-combat.png" alt="Combat phase"><figcaption><b>04 Combat phase.</b> Aiming across the bay: dotted arc toward a rival island, fuse bar draining top right, cloud shadows drifting over the water.</figcaption></figure>
  <figure><img src="05-results.png" alt="Results"><figcaption><b>05 Results.</b> Ranking with shared ranks on ties, play again joins a fresh room.</figcaption></figure>
  <figure><img src="06-sandbox-aim.png" alt="Sandbox aiming"><figcaption><b>06 Sandbox · aiming.</b> Slingshot pull with dotted arc; the fuse ring and bar start draining the moment the bomb is picked up.</figcaption></figure>
  <figure><img src="07-sandbox-boom.png" alt="Sandbox detonation"><figcaption><b>07 Sandbox · detonation.</b> Fireball with a hot core, shockwave ring, tumbling voxel debris, camera shake.</figcaption></figure>
  <figure><img src="07b-sandbox-boom-smoke.png" alt="Sandbox smoke"><figcaption><b>07b Sandbox · smoke.</b> A quarter second later: dark smoke rolls up and turns grey, crater exposed below.</figcaption></figure>
  <figure><img src="08-sandbox-crater.png" alt="Sandbox crater"><figcaption><b>08 Sandbox · aftermath.</b> Crater down to the rock floor; bedrock is indestructible.</figcaption></figure>
  <figure><img src="09-sandbox.png" alt="Sandbox island"><figcaption><b>09 Sandbox island.</b> Pixel-art block textures, baked ambient occlusion, stepped floating-chunk terrain, mist at the waterline.</figcaption></figure>
  <figure><img src="10-hero.png" alt="Voxel hero"><figcaption><b>10 Voxel hero.</b> Procedural chibi character: team-coloured outfit, bandana, bomb at their feet.</figcaption></figure>
  <figure><img src="11-match-mist.png" alt="Match with mist"><figcaption><b>11 Match.</b> Heroes on every island, low mist around each cliff, distance haze.</figcaption></figure>
  <figure><img src="12-bomb-flight.png" alt="Bomb in flight"><figcaption><b>12 Online bomb in flight.</b> Server-side Rapier flight, interpolated on the client, fuse ring ticking.</figcaption></figure>
  <figure><img src="13-explosion.png" alt="Online explosion"><figcaption><b>13 Online explosion.</b> A bot's bomb detonating on the player's island; damage arrives as terrain diffs and pays coins to the thrower.</figcaption></figure>
  <figure><img src="14-clouds.png" alt="Clouds"><figcaption><b>14 Clouds.</b> Voxel clouds drifting over the bay with their shadows on the water.</figcaption></figure>
  <figure><img src="15-build-ghost.png" alt="Build ghost"><figcaption><b>15 Build phase · ghost.</b> Camera zooms onto your island; the selected piece's footprint snaps to the hovered face and turns green when the shared placement rules allow it.</figcaption></figure>
  <figure><img src="16-build-phase.png" alt="Build phase"><figcaption><b>16 Build phase · placed.</b> A floor with a rotated wall stacked on it, placed through real clicks; the bar shows the piece budget.</figcaption></figure>
  <figure><img src="17-combat-water.png" alt="Combat with water"><figcaption><b>17 Combat.</b> Animated sea with shimmer, lanterns beside the heroes, bot-built structures ready to be bombed.</figcaption></figure>
  <figure><img src="18-first-person-build.png" alt="First-person build"><figcaption><b>18 First person · build.</b> Crosshair placement with the ghost footprint snapped to the ground ahead.</figcaption></figure>
  <figure><img src="19-first-person-throw.png" alt="First-person throw"><figcaption><b>19 First person · throw.</b> Hold to charge (bar under the crosshair), release to throw along the view.</figcaption></figure>
  <figure><img src="20-mobile-menu.png" alt="Mobile menu"><figcaption><b>20 Phone · menu.</b> 844×390 landscape emulation.</figcaption></figure>
  <figure><img src="21-mobile-build.png" alt="Mobile build"><figcaption><b>21 Phone · build.</b> Joystick, PLACE / REMOVE / ROT buttons, compact HUD and scrollable piece bar.</figcaption></figure>
  <figure><img src="22-mobile-combat-fp.png" alt="Mobile first person"><figcaption><b>22 Phone · first person combat.</b> Drag the right half to look, hold THROW to charge, GRAB for landed bombs.</figcaption></figure>
  <figure><img src="23-top-view.png" alt="Top view"><figcaption><b>23 Top view.</b> Straight down on your island, zoomed in with +; zoom out to see the whole bay. V or VIEW cycles 3RD → TOP → 1ST.</figcaption></figure>
</main>
</body>
</html>
